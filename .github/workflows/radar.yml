name: Radar quotidien

on:
  schedule:
    # Deux passages par jour : être parmi les premiers à répondre compte beaucoup
    # sur les missions courtes. Heures UTC (= 6h15 et 13h15 à Paris en hiver).
    - cron: "15 5 * * *"
    - cron: "15 12 * * *"
  workflow_dispatch:      # lancement manuel depuis l'onglet Actions
  push:                   # front modifié ou analyses IA poussées => republication sans re-scanner
    branches: [main]
    paths:
      - "site/**"
      - "!site/data/**"
      - "data/ai.json"
      - "radar/**"
      - ".github/workflows/radar.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Republier avec les analyses IA (sans scanner)
        if: github.event_name == 'push'
        run: python -m radar --publish-only

      - name: Scanner les sources et régénérer les données
        if: github.event_name != 'push'
        env:
          # Email optionnel : sans SMTP_PASSWORD, rien n'est envoyé (le site suffit).
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python -m radar

      - name: Versionner les données
        run: |
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data site/feed.xml site/feed-courtes.xml
          label=$([ "${{ github.event_name }}" = "push" ] && echo "republication" || echo "scan")
          git commit -m "Données : $label du $(date -u +'%Y-%m-%d %H:%M') UTC" || echo "Aucun changement"
          git pull --rebase
          git push

  deploy:
    needs: scan
    if: needs.scan.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # récupère les données que le job scan vient de pousser
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
